<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>川柳ストック</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3A6090">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E7E4D9; --paper:#FBFAF5; --paper-edge:#DCD8C9; --ink:#2B2621; --ink-soft:#6E665C;
    --indigo:#29415C; --indigo-ink:#1D3247; --hanko:#A63B2E; --line:#D8D3C5;
    --field:#FFFFFF; --track:#EFEBDF; --btn-text:#F5F3EC;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1A17; --paper:#262420; --paper-edge:#3A3731; --ink:#ECE8DE; --ink-soft:#A8A093;
      --indigo:#4F7499; --indigo-ink:#6C93B8; --hanko:#C85A4C; --line:#3A3731;
      --field:#1F1D1A; --track:#33302A; --btn-text:#FFFFFF;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1A17; --paper:#262420; --paper-edge:#3A3731; --ink:#ECE8DE; --ink-soft:#A8A093;
    --indigo:#4F7499; --indigo-ink:#6C93B8; --hanko:#C85A4C; --line:#3A3731;
    --field:#1F1D1A; --track:#33302A; --btn-text:#FFFFFF;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;min-height:100vh;padding:28px 20px 80px;}
  .wrap{max-width:980px;margin:0 auto;}
  h1{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;font-weight:700;font-size:28px;margin:0 0 4px;letter-spacing:.04em;}
  .sub{color:var(--ink-soft);font-size:13px;margin:0;}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;}
  #viewToggle,#statusFilters{flex-basis:100%;}
  .pill{border:.5px solid var(--paper-edge);background:var(--paper);color:var(--ink-soft);font-size:13px;padding:6px 14px;border-radius:20px;cursor:pointer;user-select:none;}
  .pill.active{background:var(--indigo);border-color:var(--indigo);color:var(--btn-text);}
  .spacer{flex:1;}
  .addbtn{border:none;background:var(--hanko);color:#fff;font-size:14px;font-weight:500;padding:9px 18px;border-radius:20px;cursor:pointer;font-family:inherit;}
  .searchbox{border:.5px solid var(--paper-edge);background:var(--paper);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--ink);font-family:inherit;min-width:150px;}
  .searchbox:focus,textarea:focus,select:focus,.composer input:focus{outline:2px solid var(--indigo);outline-offset:1px;}
  textarea,.composer input[type=date],.composer input[type=text],.composer select{width:100%;border:.5px solid var(--paper-edge);border-radius:6px;background:var(--field);padding:10px 12px;font-size:15px;color:var(--ink);font-family:inherit;}
  textarea{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;font-size:18px;resize:vertical;min-height:48px;}
  .daily{margin-top:16px;}
  .dailybtn{display:inline-block;max-width:100%;text-align:left;background:var(--paper);border:.5px solid var(--paper-edge);border-radius:10px;padding:8px 16px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .dailylabel{display:block;font-size:11px;color:var(--ink-soft);}
  .dailyterm{display:block;font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;font-size:20px;font-weight:700;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dailycount{display:block;font-size:11px;color:var(--ink-soft);}
  .nounbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
  .quickadd{display:flex;gap:10px;align-items:flex-start;margin-top:16px;}
  .quickadd textarea{flex:1;font-size:16px;}
  .quickbtns{display:flex;flex-direction:column;gap:6px;}
  .quickbtns .btn{padding:8px 14px;font-size:13px;white-space:nowrap;}
  .quickmsg{font-size:12px;color:var(--ink-soft);margin:6px 2px 0;min-height:16px;}
  .btn{border:.5px solid var(--paper-edge);background:var(--field);padding:9px 18px;border-radius:20px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--btn-text);}
  .btn.danger{color:var(--hanko);border-color:var(--hanko);background:none;}
  .btn:disabled{opacity:.5;cursor:default;}
  .composer{background:var(--paper);border:.5px solid var(--paper-edge);border-radius:10px;padding:0 22px;margin-top:0;max-height:0;overflow:hidden;opacity:0;transition:max-height .28s ease,opacity .2s ease,padding .28s ease,margin .28s ease;}
  .composer.open{max-height:1100px;opacity:1;padding:20px 22px;margin-top:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .row2{display:flex;gap:14px;flex-wrap:wrap;}
  .row2>div{flex:1;min-width:140px;}
  .taginput-wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .taginput-wrap input{flex:1;min-width:120px;}
  .tagsuggest{font-size:12px;padding:5px 12px;border-radius:14px;border:.5px solid var(--paper-edge);cursor:pointer;background:var(--field);}
  .composer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap;}
  .composer-actions .left{display:flex;gap:10px;}
  .err{color:var(--hanko);font-size:12px;margin-top:6px;display:none;}
  .count{font-size:12px;color:var(--ink-soft);margin:14px 2px 0;}
  .sechead{font-family:'Shippori Mincho',serif;font-size:15px;font-weight:700;margin:22px 2px 0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:12px;}
  .card{position:relative;background:var(--paper);border:.5px solid var(--paper-edge);border-left:4px solid var(--line);border-radius:10px;padding:16px 16px 14px;cursor:pointer;}
  .poem{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;font-size:calc(19px * var(--poem-scale,1));line-height:1.55;margin:0 0 10px;white-space:pre-wrap;word-break:break-word;padding-right:30px;}
  .taglist{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .taglabel{display:inline-flex;font-size:11px;padding:3px 9px;border-radius:12px;}
  .note{font-size:12px;color:var(--ink-soft);font-style:italic;margin:0 0 10px;}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);gap:8px;}
  .promote{border:.5px solid var(--indigo);background:none;color:var(--indigo-ink);border-radius:14px;font-size:12px;padding:3px 10px;cursor:pointer;font-family:inherit;}
  .stamp{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-size:12px;font-weight:700;}
  .stamp.posted{border:1.5px solid var(--hanko);color:var(--hanko);}
  .stamp.draft{border:1.5px dashed var(--ink-soft);color:var(--ink-soft);}
  .stamp.wip{border:1.5px dashed var(--indigo-ink);color:var(--indigo-ink);}
  .stamp.hanamaru{border:none;color:var(--hanko);width:32px;height:32px;top:10px;right:12px;}
  .stamp.hanamaru svg{width:100%;height:100%;display:block;}
  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty p{margin:4px 0;}
  .loading{text-align:center;padding:60px;color:var(--ink-soft);font-size:13px;}
  .stat-cards{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}
  .statcard{background:var(--paper);border:.5px solid var(--paper-edge);border-radius:10px;padding:16px 22px;min-width:100px;text-align:center;}
  .statvalue{font-family:'Shippori Mincho',serif;font-size:24px;font-weight:700;}
  .statlabel{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .stat-section{margin-top:30px;}
  .stat-section h3{font-family:'Shippori Mincho',serif;font-size:16px;margin:0 0 4px;font-weight:700;}
  .stat-note{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
  .barlist{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .barrow{display:flex;align-items:center;gap:10px;font-size:13px;}
  .barlabel{width:96px;flex-shrink:0;color:var(--ink-soft);}
  .bartrack{flex:1;background:var(--track);border-radius:6px;overflow:hidden;height:14px;}
  .barfill{height:100%;border-radius:6px;}
  .barcount{width:84px;flex-shrink:0;text-align:right;color:var(--ink-soft);font-size:12px;}
  .wordgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .wordchip{display:flex;align-items:center;gap:7px;background:var(--paper);border:.5px solid var(--paper-edge);border-radius:16px;padding:6px 13px;font-size:13px;}
  .wordrank{font-size:11px;color:var(--ink-soft);}
  .wordtext{font-family:'Shippori Mincho',serif;}
  .wordcount{font-size:11px;color:var(--hanko);}
  .setgroup{margin-top:24px;}
  .setgroup h3{font-family:'Shippori Mincho',serif;font-size:15px;margin:0 0 4px;font-weight:700;}
  .setnote{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;border:.5px solid rgba(0,0,0,.2);}
  .login{min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;}
  .login p{color:var(--ink-soft);font-size:14px;margin:8px 0 18px;}
  .foot{margin-top:48px;font-size:12px;color:var(--ink-soft);display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .foot a{cursor:pointer;text-decoration:underline;}
  @media (max-width:560px){
    body{padding:20px 14px 80px;}
    h1{font-size:24px;}
    .grid{grid-template-columns:1fr;}
    .searchbox{flex:1;}
    .barlabel{width:78px;}
  }
</style>
</head>
<body>
<div class="login" id="login">
  <div>
    <h1>川柳ストック</h1>
    <p id="loginMsg">確認中…</p>
    <button class="addbtn" id="loginBtn" style="display:none;">Googleでログイン</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>
<div class="wrap" id="app" style="display:none;">
  <header>
    <h1>川柳ストック</h1>
    <p class="sub">川柳の集積地</p>
    <div class="toolbar">
      <div class="pillrow" id="viewToggle">
        <span class="pill active" data-view="write">書く</span>
        <span class="pill" data-view="stock">ストック</span>
        <span class="pill" data-view="stats">傾向</span>
        <span class="pill" data-view="settings">設定</span>
      </div>
      <div class="pillrow" id="statusFilters"></div>
      <div class="pillrow" id="tagFilters"></div>
      <input type="text" id="searchInput" class="searchbox" placeholder="句・備考を検索">
      <div class="spacer"></div>
      <button class="addbtn" id="openComposerBtn">＋ 詳しく入力</button>
    </div>
  </header>

  <div class="nounbar" id="nounBar" style="display:none;"><span class="pill active" id="nounBarLabel"></span><span class="pill" id="nounBarClear">解除</span></div>
  <div class="daily" id="dailyWord" style="display:none;"><button type="button" class="dailybtn" id="dailyBtn"><span class="dailylabel">今日の名詞</span><span class="dailyterm" id="dailyTerm"></span><span class="dailycount" id="dailyCount"></span></button></div>

  <div class="quickadd" id="quickAdd">
    <textarea id="quickInput" rows="1" placeholder="句を打つ／貼り付け → Enterで「推敲中」に追加(複数行は1行1句)"></textarea>
    <div class="quickbtns"><button class="btn primary" id="quickBtn">推敲中に追加</button><button class="btn" id="quickStockBtn">ストックに登録</button></div>
  </div>
  <div class="quickmsg" id="quickMsg"></div>

  <div class="composer" id="composer">
    <div class="field">
      <label for="poemInput">句</label>
      <textarea id="poemInput" placeholder="五七五を書きとめる"></textarea>
      <div class="err" id="poemErr">句を入力してください</div>
    </div>
    <div class="row2">
      <div class="field">
        <label>状態</label>
        <div class="pillrow" id="statusToggle">
          <span class="pill" data-status="wip">推敲中</span>
          <span class="pill" data-status="draft">投稿前</span>
          <span class="pill" data-status="posted">投稿済み</span>
        </div>
      </div>
      <div class="field">
        <label for="dateInput">作成日</label>
        <input type="date" id="dateInput">
      </div>
    </div>
    <div class="field" id="selectField" style="display:none;">
      <label>選考</label>
      <div class="pillrow" id="selToggle">
        <span class="pill" data-sel="yes">選あり</span>
        <span class="pill" data-sel="no">選なし</span>
      </div>
      <div id="resultWrap" style="display:none;margin-top:10px;">
        <input type="text" id="resultInput" placeholder="選考結果(入選・佳作など。落選や結果待ちは空欄のまま)">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="genreInput">ジャンル</label>
        <select id="genreInput">
          <option value="川柳">川柳</option>
          <option value="七七・十四字">七七・十四字</option>
          <option value="自由律俳句">自由律俳句</option>
        </select>
      </div>
      <div class="field">
        <label for="noteInput">備考(任意)</label>
        <input type="text" id="noteInput" placeholder="メモがあれば">
      </div>
    </div>
    <div class="field">
      <label for="tagInput">区分(複数可・読点やカンマで区切る)</label>
      <div class="taginput-wrap">
        <input type="text" id="tagInput" placeholder="冷、笑 のように">
        <span class="tagsuggest" data-tag="笑">笑</span>
        <span class="tagsuggest" data-tag="冷">冷</span>
        <span class="tagsuggest" data-tag="温">温</span>
        <span class="tagsuggest" data-tag="劇薬">劇薬</span>
        <span class="tagsuggest" data-tag="ミント">ミント</span>
        <span class="tagsuggest" data-tag="音">音</span>
        <span class="tagsuggest" data-tag="ギミック">ギミック</span>
        <span class="tagsuggest" data-tag="エロス">エロス</span>
      </div>
    </div>
    <div class="composer-actions">
      <div class="left">
        <button class="btn primary" id="saveBtn">書き留める</button>
        <button class="btn" id="cancelBtn">やめる</button>
      </div>
      <button class="btn danger" id="deleteBtn" style="display:none;">この句を消す</button>
    </div>
  </div>

  <p class="count" id="countLabel"></p>
  <div id="gridArea"><div class="loading">読み込み中…</div></div>
  <div id="statsArea" style="display:none;"></div>
  <div id="settingsArea" style="display:none;"></div>
  <div class="foot">
    <a id="exportLink">バックアップを保存</a>
    <a id="importLink">バックアップを読み込む</a>
    <a id="logoutLink">ログアウト</a>
    <span id="whoami"></span>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDca_wGk7K61_XGBCGUW6vpcPytzR6kCrM",
  authDomain: "senryu-7ae0b.firebaseapp.com",
  projectId: "senryu-7ae0b",
  storageBucket: "senryu-7ae0b.firebasestorage.app",
  messagingSenderId: "86058317529",
  appId: "1:86058317529:web:a9344e30bf04bb6abd30c8"
};
const app_ = initializeApp(firebaseConfig);
const auth = getAuth(app_);
let db;
try{
  db = initializeFirestore(app_, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
}catch(e){
  db = getFirestore(app_);
}

const STATUS_LABEL = {wip:'推敲中', draft:'投稿前', posted:'投稿済み'};
const STATUS_STAMP = {wip:'推', draft:'未', posted:'済'};
const CHUNK_MAX = 60;

let col = null, userId = null, unsub = null, ready = false, loaded = false, fatal = false;
let chunks = {};
let entries = [];
let viewMode = 'write', quickQueued = false, filterStatus = 'all', filterTag = null, searchQuery = '';
let editingId = null, composerStatus = 'wip', composerFromQuick = false;
let filterNoun = null;
let composerSel = null;

const TAG_COLORS = {
  '笑':{bg:'#F3E3D6',fg:'#B5642F'}, '冷':{bg:'#DEE9EF',fg:'#3E6C8A'}, '温':{bg:'#F2E7CE',fg:'#8F6F1F'},
  '劇薬':{bg:'#F1DCE0',fg:'#A03B4E'}, 'ミント':{bg:'#DCEFE6',fg:'#2F8A6A'}, '音':{bg:'#E3E3ED',fg:'#5A5A94'},
  'ギミック':{bg:'#F0EAD2',fg:'#7A6A20'}, 'エロス':{bg:'#F3DFEA',fg:'#A44A82'}
};
const FALLBACK = [{bg:'#E7E2D8',fg:'#6A604D'},{bg:'#DCE6E0',fg:'#3F6E5A'},{bg:'#EAE0EC',fg:'#6E4F86'}];
function tagColor(t){
  if(TAG_COLORS[t]) return TAG_COLORS[t];
  let h=0; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0;
  return FALLBACK[h%FALLBACK.length];
}
function parseTags(s){ return s ? s.split(/[、,]/).map(x=>x.trim()).filter(Boolean) : []; }
function uid(){ return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todayLocal(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(d){
  if(!d) return '';
  const p=d.split('-'); if(!p[0]) return '';
  return p[0]+'年'+parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日';
}
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- storage (Firestore: users/{uid}/chunks/{cid}) ---------- */
function rebuild(){
  entries = [];
  Object.keys(chunks).sort().forEach(k=>{ chunks[k].forEach(e=>entries.push(e)); });
  if(loaded) scheduleNouns();
}
function findChunk(id){
  for(const k of Object.keys(chunks)){ if(chunks[k].some(e=>e.id===id)) return k; }
  return null;
}
function targetChunk(){
  const keys = Object.keys(chunks).sort();
  const last = keys[keys.length-1];
  if(!last) return 'c001';
  if(chunks[last].length < CHUNK_MAX) return last;
  return 'c'+String(parseInt(last.slice(1),10)+1).padStart(3,'0');
}
function persist(cids){
  [...new Set(cids)].forEach(cid=>{
    const items = chunks[cid] || [];
    setDoc(doc(col, cid), {items}).catch(err=>{ console.error(err); flash('保存に失敗しました。通信状況を確認してください'); });
  });
}
function flash(t){ document.getElementById('quickMsg').textContent = t; }

function startSync(user){
  userId = user.uid;
  col = collection(db, 'users', userId, 'chunks');
  document.getElementById('whoami').textContent = user.email || '';
  loadNounCache();
  unsub = onSnapshot(col, snap=>{
    const next = {};
    snap.docs.forEach(d=>{
      const items = (d.data() && d.data().items) || [];
      next[d.id] = items.map(x=>Object.assign({},x));
    });
    chunks = next;
    rebuild();
    loaded = true;
    if(!snap.metadata.fromCache || snap.size>0) ready = true;
    render();
    scheduleNouns();
    if(ready && quickQueued){ quickQueued = false; quickAdd(); }
  }, err=>{ console.error(err); setFatal(); });
}
function stopSync(){
  if(unsub){ unsub(); unsub = null; }
  col = null; userId = null; chunks = {}; entries = []; ready = false; loaded = false; fatal = false;
  resetNouns();
  document.getElementById('gridArea').innerHTML = '<div class="loading">読み込み中…</div>';
}
function setFatal(){
  fatal = true;
  document.getElementById('gridArea').innerHTML = '<div class="empty"><p>データを読み込めませんでした。</p><p>通信状況を確認して、開き直してください。</p></div>';
}

/* ---------- バックアップ ---------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify({version:1, entries}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();

async function importBackup(file){
  if(!ready){ alert('読み込み中です。少し待ってからもう一度お試しください'); return; }
  try{
    const obj = JSON.parse(await file.text());
    const arr = Array.isArray(obj) ? obj : (obj.entries || []);
    const existing = new Set(entries.map(e=>e.id));
    const touched = []; let added = 0;
    arr.forEach(e=>{
      if(!e || !e.poem || !e.id || existing.has(e.id)) return;
      existing.add(e.id);
      const cid = targetChunk();
      if(!chunks[cid]) chunks[cid] = [];
      const item = {id:e.id, poem:e.poem, status:e.status||'draft', date:e.date||'', genre:e.genre||'川柳', tags:e.tags||[], note:e.note||'', ts:e.ts||0};
      if(e.selection==='yes' || e.selection==='no') item.selection = e.selection;
      if(typeof e.selectionResult==='string' && e.selectionResult) item.selectionResult = e.selectionResult;
      chunks[cid].push(item);
      touched.push(cid); added++;
    });
    rebuild(); render(); if(touched.length) persist(touched);
    alert(added+'句を読み込みました');
  }catch(err){ alert('ファイルを読み込めませんでした'); }
}

function allTags(){
  const set = new Set();
  entries.forEach(e=>(e.tags||[]).forEach(t=>set.add(t)));
  const order = ['笑','冷','温','劇薬','ミント','音','ギミック','エロス'];
  return Array.from(set).sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    if(ia===-1&&ib===-1) return a.localeCompare(b,'ja');
    if(ia===-1) return 1; if(ib===-1) return -1; return ia-ib;
  });
}

// 花丸(外側に花びら・内側にうずまき)。色は currentColor(=朱色)
const HANAMARU_SVG = (function(){
  const pts = [];
  for(let k=0;k<8;k++){ const a=(k*45+22.5)*Math.PI/180; pts.push([(14+8.4*Math.sin(a)).toFixed(2),(14-8.4*Math.cos(a)).toFixed(2)]); }
  let d = 'M'+pts[0][0]+' '+pts[0][1];
  for(let k=1;k<=8;k++){ const q=pts[k%8]; d += ' A3.7 3.7 0 0 1 '+q[0]+' '+q[1]; }
  return '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+d+' Z"/><path d="M14 14 a1 1 0 0 1 2 0 a2 2 0 0 1 -4 0 a3 3 0 0 1 6 0 a4 4 0 0 1 -8 0"/></svg>';
})();

/* ---------- 今日の名詞 ---------- */
// 句の中の名詞を形態素解析(kuromoji.js)で取り出し、毎日1語を等確率で選ぶ。
// 名詞のデータはFirestoreに保存しない。解析結果は、句の文字列そのものではなくそのハッシュ(短い符号)をキーにして端末に覚える。
// 選んだ1語だけ users/{uid}/meta/daily に保存し、別の端末でも同じ語になるようにする。
const NOUN_CACHE_VER = 1;
const NOUN_POS_OK = ['一般','固有名詞','サ変接続','副詞可能'];
let tokenizer = null, tokenizerState = 'idle';
let nounCache = {}, nounIndex = null, nounBusy = false, nounDirty = false, nounTimer = null;
let daily = {date:null, word:null}, dailyBusy = false;

function jstToday(){ return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date()); }
function hashStr(s){
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){ const ch=s.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function nounKey(){ return 'senryu-nouns-'+userId; }
function loadNounCache(){
  nounCache = {};
  try{ const o = JSON.parse(localStorage.getItem(nounKey())||'null'); if(o && o.v===NOUN_CACHE_VER && o.m) nounCache = o.m; }catch(e){}
}
function saveNounCache(){
  try{
    const keep = {}; entries.forEach(e=>{ const k=hashStr(e.poem); if(nounCache[k]) keep[k]=nounCache[k]; });
    nounCache = keep;
    localStorage.setItem(nounKey(), JSON.stringify({v:NOUN_CACHE_VER, m:keep}));
  }catch(e){}
}
function resetNouns(){
  clearTimeout(nounTimer); nounCache = {}; nounIndex = null; daily = {date:null, word:null}; filterNoun = null;
}
function dailyReady(){ return !!(daily.word && nounIndex && nounIndex.has(daily.word)); }
function extractNouns(poem){
  const out = [];
  tokenizer.tokenize(poem.normalize('NFKC')).forEach(t=>{
    if(t.pos!=='名詞' || !NOUN_POS_OK.includes(t.pos_detail_1)) return;
    let w = (t.basic_form && t.basic_form!=='*') ? t.basic_form : t.surface_form;
    w = w.toLowerCase();
    if(/^[ぁ-んァ-ヶー]$/.test(w) || !/[一-龥々〆ぁ-んァ-ヶA-Za-z0-9]/.test(w)) return;
    out.push(w);
  });
  return out;
}
function loadTokenizer(){
  if(tokenizerState!=='idle') return;
  tokenizerState = 'loading';
  // 辞書の展開は少し重いので、画面が表示されてから裏で始める
  setTimeout(()=>{
    const s = document.createElement('script'); s.src = 'lib/kuromoji.js';
    s.onerror = ()=>{ tokenizerState = 'failed'; };
    s.onload = ()=>{
      try{
        window.kuromoji.builder({dicPath:'dict/'}).build((err,t)=>{
          if(err || !t){ tokenizerState = 'failed'; console.error(err); return; }
          tokenizer = t; tokenizerState = 'ready'; scheduleNouns();
        });
      }catch(e){ tokenizerState = 'failed'; console.error(e); }
    };
    document.head.appendChild(s);
  }, 1500);
}
function scheduleNouns(){
  if(!userId || !loaded) return;
  clearTimeout(nounTimer); nounTimer = setTimeout(runNouns, 400);
}
async function runNouns(){
  if(nounBusy){ nounDirty = true; return; }
  const uidAtStart = userId; if(!uidAtStart || !loaded || !ready) return;
  nounBusy = true;
  try{
    const missing = entries.filter(e=>!nounCache[hashStr(e.poem)]);
    if(missing.length){
      if(!tokenizer){ loadTokenizer(); return; }
      for(let i=0;i<missing.length;i++){
        if(userId!==uidAtStart) return;
        nounCache[hashStr(missing[i].poem)] = extractNouns(missing[i].poem);
        if(i%40===39) await new Promise(r=>setTimeout(r,0));
      }
    }
    if(userId!==uidAtStart) return;
    saveNounCache();
    buildNounIndex();
    await ensureDaily();
    if(userId===uidAtStart){ renderDaily(); if(filterNoun) render(); }
  }catch(err){ console.error(err); }
  finally{ nounBusy = false; if(nounDirty){ nounDirty = false; scheduleNouns(); } }
}
function buildNounIndex(){
  const m = new Map();
  entries.forEach(e=>{
    (nounCache[hashStr(e.poem)]||[]).forEach(w=>{
      let r = m.get(w); if(!r){ r = {count:0, ids:new Set()}; m.set(w,r); }
      r.count++; r.ids.add(e.id);
    });
  });
  nounIndex = m;
}
async function ensureDaily(){
  if(!ready || !nounIndex || dailyBusy) return;
  const today = jstToday();
  if(daily.date===today && dailyReady()) return;
  if(!nounIndex.size){ daily = {date:null, word:null}; return; }
  dailyBusy = true;
  const uidAtStart = userId;
  try{
    let word = null;
    const ref = doc(db,'users',uidAtStart,'meta','daily');
    try{
      const snap = await getDoc(ref); const d = snap.exists() ? snap.data() : null;
      if(d && d.date===today && typeof d.word==='string') word = d.word;
    }catch(e){
      try{ const l = JSON.parse(localStorage.getItem('senryu-daily-'+uidAtStart)||'null'); if(l && l.date===today) word = l.word; }catch(_){}
    }
    if(userId!==uidAtStart) return;
    if(!word || !nounIndex.has(word)){
      const keys = Array.from(nounIndex.keys());
      word = keys[Math.floor(Math.random()*keys.length)];
      setDoc(ref,{date:today, word}).catch(err=>console.error(err));
    }
    daily = {date:today, word};
    try{ localStorage.setItem('senryu-daily-'+uidAtStart, JSON.stringify(daily)); }catch(e){}
  }finally{ dailyBusy = false; }
}
function renderDaily(){
  if(dailyReady()){
    document.getElementById('dailyTerm').textContent = daily.word;
    document.getElementById('dailyTerm').title = daily.word;
    document.getElementById('dailyCount').textContent = '登場回数：'+nounIndex.get(daily.word).count+'回';
  }
  updateViewVisibility();
}

  document.getElementById('searchInput').value = '';
  viewMode = 'stock'; render(); window.scrollTo(0,0);
}

/* ---------- 傾向 ---------- */
function statCard(v,l){ return '<div class="statcard"><div class="statvalue">'+v+'</div><div class="statlabel">'+l+'</div></div>'; }
function renderStats(){
  const area=document.getElementById('statsArea'); const total=entries.length;
  if(!total){ area.innerHTML='<div class="empty"><p>まだ句がありません。</p></div>'; return; }
  const cnt=s=>entries.filter(e=>e.status===s).length;
  const dates=entries.map(e=>e.date).filter(Boolean).sort();
  const avg=Math.round(entries.reduce((s,e)=>s+e.poem.length,0)/total*10)/10;
  const mc={}; entries.forEach(e=>{ if(e.date){ const k=e.date.slice(0,7); mc[k]=(mc[k]||0)+1; } });
  const months=Object.keys(mc).sort(); const maxM=Math.max(1,...months.map(m=>mc[m]));
  const tc={}; entries.forEach(e=>(e.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
  const tl=Object.entries(tc).sort((a,b)=>b[1]-a[1]); const maxT=Math.max(1,...tl.map(x=>x[1]));
  const wc={}; entries.forEach(e=>{ const ws=(e.poem.match(/[ァ-ヶー]{2,}/g)||[]).concat(e.poem.match(/[A-Za-z][A-Za-z0-9]{1,}/g)||[]); ws.forEach(w=>wc[w]=(wc[w]||0)+1); });
  const wl=Object.entries(wc).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,12);
  let h='<div class="stat-cards">'+statCard(total+'句','総数')+statCard(cnt('wip')+'句','推敲中')+statCard(cnt('draft')+'句','投稿前')+statCard(cnt('posted')+'句','投稿済み')+statCard(avg+'字','平均文字数')+'</div>';
  const selTargets=entries.filter(e=>e.status==='posted' && e.selection==='yes'), wins=selTargets.filter(isWin).length;
  const winRate=selTargets.length ? Math.round(wins/selTargets.length*100) : 0;
  h+='<div class="stat-section"><h3>入選率</h3><p class="stat-note">投稿済みで「選あり」の句のうち、選考結果が入っている句の割合です(気軽に眺める目安です)</p><div class="stat-cards" style="margin-top:0">'+statCard(winRate+'%','入選率')+statCard(wins+'句','入選した句')+statCard(selTargets.length+'句','投稿済み・選あり')+'</div></div>';
  h+='<div class="stat-section"><h3>月別の作句数</h3><div class="barlist">';
  months.forEach(m=>{ const c=mc[m], p=m.split('-'); h+='<div class="barrow"><span class="barlabel">'+p[0]+'年'+parseInt(p[1],10)+'月</span><div class="bartrack"><div class="barfill" style="width:'+Math.round(c/maxM*100)+'%;background:var(--indigo)"></div></div><span class="barcount">'+c+'句</span></div>'; });
  h+='</div></div><div class="stat-section"><h3>区分の内訳</h3><div class="barlist">';
  tl.forEach(([t,c])=>{ const col=tagColor(t); h+='<div class="barrow"><span class="barlabel">'+escapeHtml(t)+'</span><div class="bartrack"><div class="barfill" style="width:'+Math.round(c/maxT*100)+'%;background:'+col.fg+'"></div></div><span class="barcount">'+c+'句('+Math.round(c/total*100)+'%)</span></div>'; });
  h+='</div></div><div class="stat-section"><h3>よく出てくるカタカナ語・外来語 TOP'+wl.length+'</h3><p class="stat-note">句の中のカタカナの連続とアルファベットのまとまりを数えたもので、厳密な形態素解析ではありません</p><div class="wordgrid">';
  wl.forEach(([w,c],i)=>{ h+='<div class="wordchip"><span class="wordrank">'+(i+1)+'</span><span class="wordtext">'+escapeHtml(w)+'</span><span class="wordcount">'+c+'</span></div>'; });
  h+='</div></div><div class="stat-section"><h3>期間</h3><p class="stat-note">最初の句：'+fmtDate(dates[0])+' ／ 最新の句：'+fmtDate(dates[dates.length-1])+'</p></div>';
  area.innerHTML=h;
}

/* ---------- 設定(この端末だけに保存) ---------- */
const PALETTES = {
  ai:   {label:'藍(標準)', dot:'#29415C'},
  sumi: {label:'墨', dot:'#3B3B3B',
    light:{'--bg':'#E6E5E2','--paper':'#FAFAF8','--paper-edge':'#D5D4D0','--line':'#D5D4D0','--track':'#ECEBE8','--indigo':'#3B3B3B','--indigo-ink':'#1F1F1F','--hanko':'#9A3B34'},
    dark:{'--bg':'#161616','--paper':'#212121','--paper-edge':'#353535','--line':'#353535','--track':'#2C2C2C','--indigo':'#6A6A6A','--indigo-ink':'#9A9A9A','--hanko':'#C25A50'}},
  moegi:{label:'若草', dot:'#3E5E43',
    light:{'--bg':'#E3E7DA','--paper':'#F9FAF4','--paper-edge':'#D2D8C4','--line':'#D2D8C4','--track':'#E9EDDF','--indigo':'#3E5E43','--indigo-ink':'#2B4530','--hanko':'#A63B2E'},
    dark:{'--bg':'#171B16','--paper':'#222721','--paper-edge':'#343B32','--line':'#343B32','--track':'#2D342B','--indigo':'#5C8562','--indigo-ink':'#7FA886','--hanko':'#C85A4C'}},
  sakura:{label:'桜', dot:'#7A4A5A',
    light:{'--bg':'#EBE3E3','--paper':'#FCF9F9','--paper-edge':'#DDD0D1','--line':'#DDD0D1','--track':'#F0E7E8','--indigo':'#7A4A5A','--indigo-ink':'#5C3342','--hanko':'#B5485A'},
    dark:{'--bg':'#1C1819','--paper':'#272122','--paper-edge':'#3C3234','--line':'#3C3234','--track':'#312A2C','--indigo':'#A8707F','--indigo-ink':'#C48FA0','--hanko':'#D46A7C'}}
};
const POEM_SIZES = [['標準',1],['大',1.15],['特大',1.3]];
const SETTINGS_KEY = 'senryu-settings';
let settings = {theme:'auto', palette:'ai', poem:1};
try{ Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')); }catch(e){}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }
const mq = window.matchMedia('(prefers-color-scheme: dark)');
function applySettings(){
  const root = document.documentElement;
  if(settings.theme==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', settings.theme);
  const dark = settings.theme==='dark' || (settings.theme==='auto' && mq.matches);
  Object.values(PALETTES).forEach(p=>{ ['light','dark'].forEach(m=>{ if(p[m]) Object.keys(p[m]).forEach(k=>root.style.removeProperty(k)); }); });
  const pal = PALETTES[settings.palette];
  if(pal && pal.light){ const vars = dark ? pal.dark : pal.light; Object.keys(vars).forEach(k=>root.style.setProperty(k, vars[k])); }
  root.style.setProperty('--poem-scale', String(settings.poem||1));
}
mq.addEventListener && mq.addEventListener('change', ()=>{ if(settings.theme==='auto') applySettings(); });
function setSetting(key, value){ settings[key]=value; saveSettings(); applySettings(); renderSettings(); }
function pillGroup(options, current, onPick){
  const row = document.createElement('div'); row.className = 'pillrow';
  options.forEach(([value,label,dot])=>{
    const p = document.createElement('span'); p.className = 'pill'+(current===value?' active':'');
    if(dot){ const d=document.createElement('span'); d.className='dot'; d.style.background=dot; p.appendChild(d); }
    p.appendChild(document.createTextNode(label));
    p.onclick = ()=>onPick(value); row.appendChild(p);
  });
  return row;
}
function renderSettings(){
  const area = document.getElementById('settingsArea');
  area.innerHTML = '';
  const note = document.createElement('p'); note.className='stat-note'; note.style.marginTop='18px';
  note.textContent = 'この設定は、いま使っている端末だけに保存されます(PCとスマホで別々に選べます)。';
  area.appendChild(note);
  const groups = [
    ['表示モード', '「自動」は端末のダークモード設定に合わせます', pillGroup([['auto','自動'],['light','ライト'],['dark','ダーク']], settings.theme, v=>setSetting('theme',v))],
    ['配色', '', pillGroup(Object.keys(PALETTES).map(k=>[k,PALETTES[k].label,PALETTES[k].dot]), settings.palette, v=>setSetting('palette',v))],
    ['句の文字サイズ', '', pillGroup(POEM_SIZES.map(([l,v])=>[v,l]), settings.poem, v=>setSetting('poem',v))]
  ];
  groups.forEach(([title,desc,row])=>{
    const g = document.createElement('div'); g.className='setgroup';
    const h = document.createElement('h3'); h.textContent = title; g.appendChild(h);
    if(desc){ const d=document.createElement('p'); d.className='setnote'; d.textContent=desc; g.appendChild(d); }
    g.appendChild(row); area.appendChild(g);
  });
}
applySettings();

/* ---------- イベント ---------- */
document.querySelectorAll('#viewToggle .pill').forEach(p=>{ p.onclick=()=>{ filterNoun=null; flash(''); viewMode=p.dataset.view; render(); }; });
document.getElementById('dailyBtn').onclick=()=>{ if(daily.word) showNounSentences(daily.word); };
document.getElementById('nounBarClear').onclick=()=>{ filterNoun=null; render(); };
document.getElementById('searchInput').oninput=e=>{ searchQuery=e.target.value.trim(); render(); };
document.getElementById('openComposerBtn').onclick=()=>openComposer(null,{status:'draft'});
document.getElementById('quickStockBtn').onclick=()=>{
  if(!ready){ flash('読み込み中です。少し待ってからお試しください'); return; }
  const v=document.getElementById('quickInput').value.trim();
  composerFromQuick=true;
  openComposer(null,{poem:v,status:'draft'});
};
document.getElementById('cancelBtn').onclick=closeComposer;
document.getElementById('saveBtn').onclick=saveEntry;
document.getElementById('deleteBtn').onclick=deleteEntry;
document.getElementById('quickBtn').onclick=quickAdd;
document.getElementById('quickInput').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); quickAdd(); }
});
document.querySelectorAll('#statusToggle .pill').forEach(p=>{ p.onclick=()=>setComposerStatus(p.dataset.status); });
document.querySelectorAll('#selToggle .pill').forEach(p=>{ p.onclick=()=>{ composerSel = composerSel===p.dataset.sel ? null : p.dataset.sel; updateSelUI(); }; });
document.querySelectorAll('.tagsuggest').forEach(s=>{
  s.onclick=()=>{ const i=document.getElementById('tagInput'); const cur=parseTags(i.value); if(!cur.includes(s.dataset.tag)) cur.push(s.dataset.tag); i.value=cur.join('、'); };
});

document.getElementById('exportLink').onclick = exportBackup;
document.getElementById('importLink').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = e=>{ const f=e.target.files[0]; if(f) importBackup(f); e.target.value=''; };
document.getElementById('logoutLink').onclick = ()=> signOut(auth);
document.getElementById('loginBtn').onclick = ()=>{
  document.getElementById('loginErr').style.display='none';
  signInWithPopup(auth, new GoogleAuthProvider()).catch(err=>{
    const el = document.getElementById('loginErr');
    el.textContent = 'ログインできませんでした（'+(err.code||'error')+'）';
    el.style.display = 'block';
  });
};
onAuthStateChanged(auth, user=>{
  const login = document.getElementById('login'), app = document.getElementById('app');
  if(user){
    login.style.display = 'none'; app.style.display = '';
    stopSync(); startSync(user);
    document.getElementById('quickInput').focus();
  } else {
    stopSync();
    app.style.display = 'none'; login.style.display = '';
    document.getElementById('loginMsg').textContent = 'ログインして使います';
    document.getElementById('loginBtn').style.display = '';
  }
});
</script>
